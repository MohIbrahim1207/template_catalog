<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </radialGradient>
    
    <!-- Glowing Gradients for Sectors -->
    <linearGradient id="chemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf5af2" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
    
    <linearGradient id="fluidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#64d2ff" />
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30d158" />
      <stop offset="100%" stop-color="#64d2ff" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Outer Orbit Rings (Fluid Flow Dynamics) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#fluidGrad)" stroke-width="4" stroke-dasharray="10 30" opacity="0.4" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#chemGrad)" stroke-width="2" stroke-dasharray="40 120" opacity="0.3" />
  
  <!-- Flow Particle Spheres -->
  <circle cx="160" cy="100" r="12" fill="#bf5af2" filter="url(#glow)" />
  <circle cx="390" cy="350" r="16" fill="#0a84ff" filter="url(#glow)" />
  <circle cx="90" cy="300" r="10" fill="#30d158" filter="url(#glow)" />
  
  <!-- Main 3D Isometric Cube Element -->
  <g transform="translate(256, 266) scale(1.1)">
    <!-- Bottom Face -->
    <path d="M 0,60 L 104,0 L 0,-60 L -104,0 Z" fill="rgba(20,20,30,0.6)" stroke="url(#fluidGrad)" stroke-width="2" />
    
    <!-- Left Face -->
    <path d="M -104,0 L 0,60 L 0,140 L -104,80 Z" fill="url(#fluidGrad)" opacity="0.15" />
    <path d="M -104,0 L 0,60 L 0,140 L -104,80 Z" fill="none" stroke="url(#fluidGrad)" stroke-width="4" />
    
    <!-- Right Face -->
    <path d="M 104,0 L 0,60 L 0,140 L 104,80 Z" fill="url(#waterGrad)" opacity="0.1" />
    <path d="M 104,0 L 0,60 L 0,140 L 104,80 Z" fill="none" stroke="url(#waterGrad)" stroke-width="4" />
    
    <!-- Top Face -->
    <path d="M 0,-80 L 104,-140 L 0,-200 L -104,-140 Z" fill="rgba(30,30,45,0.7)" stroke="url(#chemGrad)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Internal Core (Industrial Shaft/Filter) -->
    <path d="M -20,-30 L 20,-30 L 20,70 L -20,70 Z" fill="url(#fluidGrad)" filter="url(#glow)" opacity="0.8" />

    <!-- Connective piping rings (Procedural Tech Lines) -->
    <path d="M -60,-20 L 0,10 L 60,-20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
    <path d="M -60,10 L 0,40 L 60,10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" filter="url(#glow)" />
  </g>

  <!-- Title / Logo Font Mockup -->
  <text x="256" y="450" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="6">FlowForce</text>
  <text x="256" y="475" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="400" fill="url(#fluidGrad)" letter-spacing="4">PRODUCT SHOWCASE</text>
</svg>
